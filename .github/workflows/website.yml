name: Check Relay website
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: relay-website-preview
          path: dist
